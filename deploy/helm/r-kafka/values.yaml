# ─────────────────────────────────────────────────────────────
# R-Kafka Helm Chart — 默认值
# ─────────────────────────────────────────────────────────────

# -- 副本数 (Broker 节点数，建议奇数: 1, 3, 5)
replicaCount: 3

image:
  repository: ghcr.io/regalpine/r-kafka
  tag: ""  # 默认使用 Chart appVersion
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

# ─── Broker 配置 ──────────────────────────────────────────────
broker:
  # -- 起始 Broker ID (StatefulSet ordinal 会叠加)
  startId: 1
  # -- 监听端口 (Kafka 协议)
  port: 9092
  # -- Controller 端口 (KRaft)
  controllerPort: 9093
  # -- 机架感知 (可选，可通过 topology.kubernetes.io/zone 自动注入)
  rack: ""

# ─── 存储 ─────────────────────────────────────────────────────
storage:
  # -- 数据目录 (容器内路径)
  dataDir: /data/r-kafka
  # -- Segment 最大字节数 (1GB)
  segmentMaxSize: 1073741824
  # -- Segment 最大存活时间 (毫秒, 30min)
  segmentMaxTimeMs: 1800000
  # -- Flush 间隔 (毫秒)
  flushIntervalMs: 5
  # -- Flush 模式: async | sync | hybrid
  flushMode: hybrid
  # -- I/O 引擎: stdio | io_uring (仅 Linux)
  ioEngine: stdio

  # -- PVC 配置
  persistence:
    enabled: true
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 100Gi
    annotations: {}

# ─── 保留策略 ─────────────────────────────────────────────────
retention:
  # -- 最大保留字节数 (1TB)
  maxBytes: 1099511627776
  # -- 最大保留时间 (毫秒, 7天)
  maxMs: 604800000
  compactionEnabled: false

# ─── 副本管理 ─────────────────────────────────────────────────
replication:
  defaultReplicationFactor: 3
  minIsrSize: 2
  replicaLagTimeMaxMs: 10000
  uncleanLeaderElection: false

# ─── 网络 ─────────────────────────────────────────────────────
network:
  maxConnections: 100000
  maxRequestSize: 104857600
  maxPendingBytes: 536870912

# ─── 安全 ─────────────────────────────────────────────────────
security:
  tls:
    enabled: false
    mode: one-way  # one-way | mutual
    # -- 已有 Secret 名称 (包含 tls.crt, tls.key, ca.crt)
    existingSecret: ""
    # -- 或者内联证书路径 (当使用 cert-manager 时自动注入)
    certPath: /etc/r-kafka/tls/tls.crt
    keyPath: /etc/r-kafka/tls/tls.key
    caPath: /etc/r-kafka/tls/ca.crt
    # -- cert-manager Issuer 名称 (留空则不创建 Certificate 资源)
    issuerName: "ca-issuer"
    # -- cert-manager Issuer 类型
    issuerKind: "ClusterIssuer"

  sasl:
    enabled: false
    mechanisms:
      - SCRAM-SHA-512
    # -- SASL 用户列表
    users: []
    # - username: admin
    #   password: changeme

  acl:
    enabled: false

# ─── 可观测性 ─────────────────────────────────────────────────
observability:
  metrics:
    enabled: true
    port: 9090
    # -- 创建 Prometheus ServiceMonitor
    serviceMonitor:
      enabled: false
      interval: 30s
      scrapeTimeout: 10s
      labels: {}

  tracing:
    enabled: false
    layer: json  # fmt | json | opentelemetry
    endpoint: ""  # OTLP collector endpoint, e.g. http://otel-collector:4317

# ─── 资源限制 ─────────────────────────────────────────────────
resources:
  requests:
    cpu: "1"
    memory: 2Gi
  limits:
    cpu: "4"
    memory: 8Gi

# ─── Pod 调度 ─────────────────────────────────────────────────
nodeSelector: {}

tolerations: []

# -- Pod 反亲和性: 将 Broker 分散到不同节点
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - r-kafka
          topologyKey: kubernetes.io/hostname

# -- Pod 拓扑分散约束 (跨可用区)
topologySpreadConstraints: []
# - maxSkew: 1
#   topologyKey: topology.kubernetes.io/zone
#   whenUnsatisfiable: DoNotSchedule
#   labelSelector:
#     matchLabels:
#       app.kubernetes.io/name: r-kafka

# ─── Pod 中断预算 ─────────────────────────────────────────────
podDisruptionBudget:
  enabled: true
  minAvailable: ""
  maxUnavailable: 1

# ─── 探针 ─────────────────────────────────────────────────────
livenessProbe:
  httpGet:
    path: /health
    port: metrics
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /ready
    port: metrics
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

# -- 优雅关闭宽限期 (秒)
terminationGracePeriodSeconds: 30

# -- Pod 安全上下文
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532

# -- 容器安全上下文
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# -- 额外环境变量
extraEnv: []

# -- 额外 Volume 挂载
extraVolumes: []
extraVolumeMounts: []

# -- Pod 注解
podAnnotations: {}

# -- Pod 标签
podLabels: {}
