# ─────────────────────────────────────────────────────────────
# Headless Service — StatefulSet DNS 发现 (Pod 间 Raft 通信)
# ─────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: {{ include "r-kafka.headlessName" . }}
  labels:
    {{- include "r-kafka.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: kafka
      port: {{ .Values.broker.port }}
      targetPort: kafka
      protocol: TCP
    - name: controller
      port: {{ .Values.broker.controllerPort }}
      targetPort: controller
      protocol: TCP
  selector:
    {{- include "r-kafka.selectorLabels" . | nindent 4 }}
---
# ─────────────────────────────────────────────────────────────
# Client Service — 客户端负载均衡入口
# ─────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: {{ include "r-kafka.fullname" . }}
  labels:
    {{- include "r-kafka.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: kafka
      port: {{ .Values.broker.port }}
      targetPort: kafka
      protocol: TCP
    {{- if .Values.observability.metrics.enabled }}
    - name: metrics
      port: {{ .Values.observability.metrics.port }}
      targetPort: metrics
      protocol: TCP
    {{- end }}
  selector:
    {{- include "r-kafka.selectorLabels" . | nindent 4 }}
