# R-Kafka 单机部署配置
# 适用于开发/测试环境

[broker]
id = 1
host = "0.0.0.0"
port = 9092

[storage]
data_dir = "/var/lib/r-kafka/data"
segment_max_size = 1073741824       # 1GB
segment_max_time_ms = 1800000       # 30min
flush_interval_ms = 5
flush_mode = "hybrid"               # async | sync | hybrid

[retention]
max_bytes = 1099511627776           # 1TB
max_ms = 604800000                  # 7 days
compaction_enabled = false

[replication]
default_replication_factor = 1
min_isr_size = 1
replica_lag_time_max_ms = 10000
unclean_leader_election = false

[network]
max_connections = 10000
max_request_size = 104857600        # 100MB
max_pending_bytes = 536870912       # 512MB

[security]
tls_enabled = false
sasl_enabled = false

[controller]
election_timeout_ms = 3000

[observability]
metrics_enabled = true
metrics_port = 9090
tracing_enabled = true
tracing_layer = "fmt"               # fmt | json
