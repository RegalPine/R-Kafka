# R-Kafka 3 节点集群配置 — 节点 1
# 复制此文件到每个节点，修改 broker.id 和 rack

[broker]
id = 1                              # 节点 2: id=2, 节点 3: id=3
host = "0.0.0.0"
port = 9092
rack = "rack-a"                     # 节点 2: rack-b, 节点 3: rack-c

[storage]
data_dir = "/var/lib/r-kafka/data"
segment_max_size = 1073741824       # 1GB
segment_max_time_ms = 1800000       # 30min
flush_interval_ms = 3
flush_mode = "hybrid"

[retention]
max_bytes = 1099511627776           # 1TB
max_ms = 604800000                  # 7 days
compaction_enabled = true           # 启用 Log Compaction

[replication]
default_replication_factor = 3      # 3 副本跨机架
min_isr_size = 2
replica_lag_time_max_ms = 10000
unclean_leader_election = false

[network]
max_connections = 100000
max_request_size = 104857600        # 100MB
max_pending_bytes = 536870912       # 512MB

[security]
tls_enabled = false
sasl_enabled = false

[controller]
# KRaft quorum: 所有 3 个节点
quorum_peers = [
    "1@broker1.internal:9093",
    "2@broker2.internal:9093",
    "3@broker3.internal:9093",
]
election_timeout_ms = 3000

[observability]
metrics_enabled = true
metrics_port = 9090
tracing_enabled = true
tracing_layer = "json"              # 生产环境用 JSON 格式
